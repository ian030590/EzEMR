<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' file:; style-src 'self' file: 'unsafe-inline'; img-src data: blob:; font-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<script id="offlinePrivacyGuard" src="./privacy.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EzEMR | 復健病歷</title>
<meta name="metro:init" content="false">
<meta name="metro:info" content="false">
<meta name="metro:jquery" content="false">
<script id="excelReaderLibrary" src="../vendor/xlsx-reader/xlsx.core.min.js"></script>
<script id="excelReaderInit" src="./excel-reader-init.js"></script>
<script id="excelLibrary" src="../vendor/xlsx-style/xlsx.bundle.js"></script>
<script id="themeInit" src="./theme.js"></script>
<script id="metroLibrary" src="../vendor/metroui/lib/metro.js"></script>
<script id="metroInit" src="./metro-init.js"></script>
<link id="metroLibraryStyles" rel="stylesheet" href="../vendor/metroui/lib/metro.all.css">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app-chrome app-bar" id="applicationBar" aria-label="應用程式選單">
<button class="hamburger" hidden tabindex="-1" aria-hidden="true" aria-label="應用程式選單"></button>
<header class="topbar">
  <div class="brand">
    <h1>EzEMR</h1>
  </div>
  <div class="topbar-tools">
    <span class="status" id="storeStatus" role="status">正在連接資料夾…</span>
    <label class="language-control" for="languageSelect"><select id="languageSelect" aria-label="語言" data-language-names><option value="zh-TW" lang="zh-Hant">繁體中文</option><option value="en" lang="en">English</option></select></label>
  </div>
</header>

<div class="command-area">
  <nav class="menubar app-bar-menu" aria-label="應用程式選單">
    <button class="menu-trigger" id="fileMenuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="fileMenu">檔案</button>
    <button class="menu-trigger" id="clientMenuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="clientMenu">個案</button>
    <button class="menu-trigger" id="viewMenuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="viewMenu">設定</button>
  </nav>
  <div class="command-toolbar toolbar no-divider" role="toolbar" aria-label="常用工具">
    <div class="tool-group" id="saveTools" hidden>
      <button class="tool-button save" id="toolbarSave" data-action="save-session" data-needs="draft" disabled title="儲存 CSV 與 PDF（Ctrl+S／⌘S）" aria-keyshortcuts="Control+S Meta+S"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 3h13l3 3v15H4z M8 3v6h8V3 M8 21v-8h8v8"/></svg><span data-label>儲存</span></button>
    </div>
    <div class="tool-group">
      <button class="tool-button" data-action="import-records" title="匯入 CSV、評估復能 Excel、JSON 備份或測驗分數檔"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12 M8 11l4 4 4-4 M4 15v6h16v-6"/></svg>匯入</button>
      <button class="tool-button menu-trigger" id="exportMenuButton" aria-haspopup="menu" aria-expanded="false" aria-controls="exportMenu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15V3 M8 7l4-4 4 4 M4 15v6h16v-6"/></svg>匯出</button>
    </div>
    <div class="tool-group" id="draftTools" hidden>
      <button class="tool-button" data-action="copy-editing">複製病歷</button>
      <button class="tool-button" data-action="cancel-edit">取消編輯</button>
    </div>
  </div>
</div>
<div class="patient-search" id="patientSearch">
  <label for="clientSearch"><span class="sr-only">搜尋個案</span><input type="search" id="clientSearch" role="combobox" aria-autocomplete="list" aria-haspopup="listbox" aria-expanded="false" aria-controls="clientList" placeholder="姓名／病歷號／診斷" autocomplete="off"></label>
  <button class="btn small" data-action="new-client">新增個案</button>
  <div class="patient-search-popup" id="clientSearchPopup" hidden>
    <p class="patient-search-status" id="clientSearchStatus" role="status"></p>
    <div class="clients" id="clientList" role="listbox" aria-label="搜尋結果"></div>
  </div>
</div>
</div>
<div class="command-menu" id="fileMenu" role="menu" aria-labelledby="fileMenuButton" hidden>
  <button role="menuitem" tabindex="-1" data-action="new-client">新增個案…</button>
  <button role="menuitem" tabindex="-1" data-action="new-session" data-needs="client" disabled>新增復健紀錄</button>
  <hr role="separator">
  <button role="menuitem" tabindex="-1" data-action="save-session" data-needs="draft" disabled><span data-label>儲存 CSV 與 PDF</span><kbd data-shortcut="S">Ctrl+S</kbd></button>
  <button role="menuitem" tabindex="-1" data-action="import-records">匯入 CSV／評估復能 Excel／備份／測驗分數…</button>
  <button role="menuitem" tabindex="-1" data-action="import-soap-folder">匯入舊版 SOAP 資料夾…</button>
  <hr role="separator">
  <button role="menuitem" tabindex="-1" data-action="storage-settings">儲存位置…</button>
  <button role="menuitem" tabindex="-1" data-action="change-folder" id="changeFolder" aria-keyshortcuts="Control+O Meta+O"><span>開啟病歷資料夾…</span><kbd data-shortcut="O">Ctrl+O</kbd></button>
  <button role="menuitem" tabindex="-1" data-action="reload-storage" id="reloadStorage" hidden>重新讀取資料夾</button>
  <button role="menuitem" tabindex="-1" data-action="copy-folder" id="copyBtn" hidden>設定副本資料夾…</button>
</div>
<div class="command-menu" id="clientMenu" role="menu" aria-labelledby="clientMenuButton" hidden>
  <button role="menuitem" tabindex="-1" data-action="new-client">新增個案…</button>
  <button role="menuitem" tabindex="-1" data-action="edit-client" data-needs="client" disabled>編輯目前個案…</button>
  <button role="menuitem" tabindex="-1" data-action="new-session" data-needs="client" disabled>新增復健紀錄</button>
</div>
<div class="command-menu" id="viewMenu" role="menu" aria-labelledby="viewMenuButton" hidden>
  <button role="menuitemcheckbox" tabindex="-1" data-action="toggle-theme" id="themeToggle" aria-checked="false">切換為深色</button>
  <hr role="separator">
  <button role="menuitem" tabindex="-1" data-action="global-settings">基本資料欄位…</button>
  <button role="menuitem" tabindex="-1" data-action="storage-settings">儲存位置…</button>
</div>
<div class="command-menu" id="exportMenu" role="menu" aria-labelledby="exportMenuButton" hidden>
  <span class="menu-label">目前個案</span>
  <button role="menuitem" tabindex="-1" data-action="xlsx-client" data-needs="client" disabled>匯出個案 Excel</button>
  <hr role="separator">
  <span class="menu-label">全部個案</span>
  <button role="menuitem" tabindex="-1" data-action="export-roster" data-needs="store" disabled>匯出個案總表 CSV</button>
  <button role="menuitem" tabindex="-1" data-action="xlsx-all" data-needs="store" disabled>匯出全部個案 Excel</button>
  <button role="menuitem" tabindex="-1" data-action="export-all" data-needs="store" disabled>備份全部資料（JSON）</button>
</div>
<input type="file" id="importFile" accept=".csv,text/csv,.json,application/json,.xlsb,.xlsx" multiple hidden>
<input type="file" id="importSOAPFolder" webkitdirectory multiple hidden>
<div id="integratedDataNotice" class="row" role="status" style="padding:12px 28px;border-bottom:1px solid var(--line);background:var(--surface)" hidden>
  <p class="note" style="flex:1;min-width:0;margin:0">目前顯示病歷副本。連接病歷資料夾後可讀取最新檔案並直接儲存。</p>
  <button class="btn small" id="integratedDataConnect" data-action="pick-folder">連接病歷資料夾</button>
</div>

<div id="toastHost"></div>

<div class="app">
  <main class="main" id="main"></main>
</div>
<div id="layer"></div>

<script src="./app.js"></script>
</body>
</html>
